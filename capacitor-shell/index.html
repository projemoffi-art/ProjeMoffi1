<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Moffi</title>
    <style>
        :root { color-scheme: light dark; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               font-family: -apple-system, system-ui, sans-serif; background: #F7F3EA; color: #201B16; text-align: center; padding: 24px; box-sizing: border-box; }
        @media (prefers-color-scheme: dark) { body { background: #141210; color: #F7F3EA; } }
        h1 { font-size: 20px; margin: 16px 0 8px; }
        p { font-size: 15px; opacity: .7; margin: 0 0 24px; line-height: 1.5; }
        button { border: 0; border-radius: 999px; padding: 14px 28px; font-size: 15px; font-weight: 600; background: #EE5B3D; color: #fff; }
    </style>
</head>
<body>
    <main>
        <div style="font-size:44px" aria-hidden="true">🐾</div>
        <h1>İnternet bağlantısı yok</h1>
        <p>Moffi'yi kullanmak için internete bağlanman gerekiyor.<br />Bağlantın gelince tekrar dene.</p>
        <button onclick="location.href='https://app.moffi.net/'">Tekrar dene</button>
    </main>
</body>
</html>
